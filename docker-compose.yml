services:
  postgres:
    image: postgres:16-alpine
    container_name: calib-postgres
    environment:
      POSTGRES_DB: calib
      POSTGRES_USER: calib
      POSTGRES_PASSWORD: calib
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calib -d calib"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
