services:
  - type: web
    name: calib-dashboard
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: calib-postgres
          property: connectionString

databases:
  - name: calib-postgres
    plan: free
